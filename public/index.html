<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taskboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ AUTH VIEW ============ -->
  <main id="auth-view" class="auth" hidden>
    <section class="auth-card">
      <h1 class="brand">Taskboard</h1>
      <p class="tagline">Keep track of what you need to finish.</p>

      <div class="tabs" role="tablist">
        <button id="tab-login" class="tab active" role="tab" aria-selected="true">Log in</button>
        <button id="tab-register" class="tab" role="tab" aria-selected="false">Create account</button>
      </div>

      <form id="login-form" class="form" novalidate>
        <label>Email
          <input type="email" id="login-email" autocomplete="email" required />
        </label>
        <label>Password
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <p class="error" id="login-error" role="alert"></p>
        <button class="btn primary" type="submit">Log in</button>
      </form>

      <form id="register-form" class="form" novalidate hidden>
        <label>Name
          <input type="text" id="reg-name" autocomplete="name" required />
        </label>
        <label>Email
          <input type="email" id="reg-email" autocomplete="email" required />
        </label>
        <label>Password <span class="hint">at least 6 characters</span>
          <input type="password" id="reg-password" autocomplete="new-password" minlength="6" required />
        </label>
        <p class="error" id="register-error" role="alert"></p>
        <button class="btn primary" type="submit">Create account</button>
      </form>
    </section>
  </main>

  <!-- ============ APP VIEW ============ -->
  <div id="app-view" hidden>
    <header class="topbar">
      <h1 class="brand small">Taskboard</h1>
      <div class="user">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn ghost">Log out</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel composer">
        <h2 id="form-title">Add a task</h2>
        <form id="task-form" class="form" novalidate>
          <input type="hidden" id="task-id" />
          <label>Title
            <input type="text" id="task-title" maxlength="120" required />
          </label>
          <label>Details
            <textarea id="task-desc" rows="3" maxlength="500"></textarea>
          </label>
          <div class="row">
            <label>Priority
              <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>
            <label>Due date
              <input type="date" id="task-due" />
            </label>
          </div>
          <p class="error" id="task-error" role="alert"></p>
          <div class="row actions">
            <button class="btn primary" type="submit" id="task-submit">Add task</button>
            <button class="btn ghost" type="button" id="task-cancel" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel list-panel">
        <div class="list-head">
          <div>
            <h2>Your tasks</h2>
            <p class="summary" id="summary"></p>
          </div>
          <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks" />
        </div>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="pending">Pending</button>
          <button class="chip" data-filter="done">Done</button>
        </div>

        <ul id="task-list" class="task-list"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
